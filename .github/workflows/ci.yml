name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heroes-service
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Race
        run: make race

      - name: Build
        run: make build

      - name: Lint
        run: make lint
